name: Validate Capstone

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'voting-app/**'
      - '.github/workflows/validate-capstone.yml'
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - 'k8s-specifications/**'
      - 'observability/**'
      - 'docs/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'voting-app/**'
      - '.github/workflows/validate-capstone.yml'
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - 'k8s-specifications/**'
      - 'observability/**'
      - 'docs/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  validate-helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint ./voting-app

      - name: Render Helm manifests
        run: helm template voting-app ./voting-app --namespace voting-helm
