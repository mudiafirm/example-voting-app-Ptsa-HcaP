vote:
  replicaCount: 1
  image:
    repository: example-voting-app-ptsa-hcap-vote
    tag: k8s
    pullPolicy: Never
  containerPort: 80
  service:
    type: NodePort
    port: 8080
    targetPort: 80
    nodePort: 31000

result:
  replicaCount: 1
  image:
    repository: example-voting-app-ptsa-hcap-result
    tag: latest
    pullPolicy: Never
  containerPort: 80
  service:
    type: NodePort
    port: 8081
    targetPort: 80
    nodePort: 31001

worker:
  replicaCount: 1
  image:
    repository: example-voting-app-ptsa-hcap-worker
    tag: latest
    pullPolicy: Never

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  containerPort: 6379
  service:
    port: 6379
  storage:
    size: 1Gi

db:
  replicaCount: 1
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  containerPort: 5432
  service:
    port: 5432
  auth:
    username: postgres
    password: postgres
    database: postgres
  storage:
    size: 1Gi
